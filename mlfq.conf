# Multi-Level Feedback Queue Configuration
# Format: QueueID TimeQuantum Allotment

# Q0: Highest priority - Very short quantum for maximum interactivity.
# If a process uses more than 50ms total here, it's not "just" a quick UI update.
Q0 30 50

# Q1: Medium priority - Balanced quantum for mixed workloads.
# Larger allotment allows processes a fair chance before sinking to the bottom.
Q1 100 100

# Q2: Lowest priority - Batch processing level.
# Quantum of -1 indicates FCFS (run until completion or preemption by higher Q).
Q2 -1 -1

# Priority Boost Period (S)
# Every 200 time units, all processes move back to Q0 to prevent starvation.
BOOST_PERIOD 200